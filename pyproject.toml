[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "bw-gui"
version = "0.1.0"
description = "Shared Tkinter GUI core for Blattwerk-family apps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ma-wolpers" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live_keyboard: sends real key strokes (win32, opt-in via BW_GUI_LIVE_KEYBOARD=1)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bw_gui"]
